<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oppr Deck Studio</title>
<link rel="preload" href="/repo/brand/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="content">
    <header id="topstrip">
      <button id="sidebar-toggle" class="icon-btn" title="Collapse sidebar" aria-label="Toggle sidebar">☰</button>
      <input id="global-search" type="search" placeholder="Search slides, graphics, decks…" autocomplete="off">
      <div class="topstrip-right">
        <button id="compose-toggle" class="ghost">Compose</button>
        <button id="refresh-btn" class="ghost" title="Re-scan the library from disk">Refresh</button>
      </div>
    </header>
    <main id="main"><div class="loading">Loading library…</div></main>
  </div>
</div>
<div id="tray" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
