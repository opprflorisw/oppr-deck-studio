<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oppr Deck Studio</title>
<!-- The mark, inline. /repo is behind the session gate, so a favicon served from
     there is a 401 on the sign-in page and a 404 in the console everywhere else.
     It is 300 bytes; a data URI costs less than the request did. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315201e'/%3E%3Ccircle cx='13.2' cy='15' r='6' fill='none' stroke='%23f2f2ed' stroke-width='3.6'/%3E%3Ccircle cx='23.6' cy='21' r='3' fill='%23a65032'/%3E%3C/svg%3E">
<link rel="preload" href="/repo/brand/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div id="content">
    <header id="topstrip">
      <button id="sidebar-toggle" class="icon-btn" title="Collapse sidebar" aria-label="Toggle sidebar">☰</button>
      <input id="global-search" type="search" placeholder="Search slides, graphics, decks…" autocomplete="off">
      <div class="topstrip-right">
        <button id="refresh-btn" class="ghost" title="Re-scan the library from disk"></button>
      </div>
    </header>
    <main id="main"><div class="loading">Loading library…</div></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
