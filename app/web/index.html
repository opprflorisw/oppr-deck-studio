<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oppr Deck Studio</title>
<link rel="preload" href="/repo/brand/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="wm">oppr<b>.</b></span><span class="app-name">Deck Studio</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="browse" class="active">Browse</button>
    <button data-view="draft">Draft <span class="count" id="draft-count">0</span></button>
    <button data-view="handoff">Handoff</button>
  </nav>
  <div class="topbar-actions">
    <button id="refresh-btn" class="ghost" title="Re-scan the library from disk">Refresh library</button>
  </div>
</header>

<main id="main">
  <div id="loading" class="loading">Loading library…</div>
</main>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
