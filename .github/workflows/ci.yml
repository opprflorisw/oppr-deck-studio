# The fast lane: every push, no secrets, no browser, no backend.
#
# The repo had no tests and no CI until 2026-08-19. The parity checks that held
# the Python and JavaScript pipelines together ran only when someone remembered,
# needed a live Supabase, and could not run on a fresh clone -- so the two guards
# holding the system's most duplicated code together were its two least runnable
# tools. Everything here runs offline in seconds.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not 20: the suite passes glob patterns to `node --test` and uses
          # --experimental-test-module-mocks, and Node 20 has neither -- its
          # runner takes the glob as a literal filename and exits 1 before a
          # single test runs. 22 is what development runs on.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: syntax
        run: node --check app/server.mjs
      - name: unit + gates
        run: npm test
